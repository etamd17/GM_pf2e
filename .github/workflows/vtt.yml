name: VTT

# The VTT checks (M6, handoff 053 item 7): the Python VTT suite on PostgreSQL,
# the client (types, tests, build, bundle boundary), the browser harness with
# a GM and a table display, and the web image. The main CI keeps running the
# rest of the app; this workflow only adds what the VTT needs.
#
# Nothing here deploys. The workflow first runs when the user approves a push
# of the VTT branch (VTT-ADR-0003).

on:
  push:
    branches: [side/vtt-rebuild, agent/claude-vtt-platform]
  pull_request:
    paths:
      - "vtt/**"
      - "frontend/vtt/**"
      - "contracts/vtt/**"
      - "migrations/**"
      - "tests/vtt/**"
      - "Dockerfile"
      - "compose.yaml"
      - "docker/**"
      - ".github/workflows/vtt.yml"

permissions:
  contents: read

concurrency:
  group: vtt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  NODE_IMAGE: node:24.12.0-bookworm-slim

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://vtt:vtt_ci@127.0.0.1:5432/vtt_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vtt_test
          POSTGRES_PASSWORD: vtt_ci
          POSTGRES_USER: vtt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtt -d vtt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-dev.txt
          pip-version: "26.2.1"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: VTT suite on PostgreSQL (including the PostgreSQL-only concurrency tests)
        run: python -m pytest -q tests/vtt -m "not browser" --strict-markers
      - name: Migrations and route policy stay consistent with the VTT on
        run: python -m pytest -q tests/persistence/test_database_and_models.py tests/persistence/test_runtime_backend.py tests/test_route_policy_inventory.py --strict-markers

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: node:24.12.0-bookworm-slim
    defaults:
      run:
        working-directory: frontend/vtt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check:protocol
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BROWSER_ARTIFACT_DIR: vtt-browser-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the client (the image's Node, not the runner's)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/frontend/vtt -u "$(id -u):$(id -g)" -e HOME=/tmp "$NODE_IMAGE" \
            sh -c "npm ci --no-audit --no-fund && npm run build && npm run check:bundle"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-browser.txt
          pip-version: "26.2.1"
      - name: Install locked browser dependencies
        run: |
          python -m pip install --require-hashes -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: GM and table in real browsers
        run: python -m pytest -q tests/vtt/e2e -m browser --strict-markers
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vtt-browser-failures
          path: vtt-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the web image (client build and bundle check run inside it)
        run: docker build --tag gm-vtt-web:ci .
      - name: The image holds no private data paths
        run: |
          docker run --rm --entrypoint sh gm-vtt-web:ci -c '
            for p in party_data campaigns users.json invites.json obsidian_vault vault_data campaign_assets uploads .env venv tests .git; do
              if [ -e "/app/$p" ]; then echo "unexpected in image: $p"; exit 1; fi
            done
            test -f /app/frontend/vtt/dist/index.html'
