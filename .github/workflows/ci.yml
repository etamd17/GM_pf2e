name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-dev.txt
          pip-version: "26.2.1"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Verify lock files are current
        run: |
          lock_check_dir="$(mktemp -d)"
          trap 'rm -rf "$lock_check_dir"' EXIT
          cp requirements.txt "$lock_check_dir/requirements.txt"
          cp requirements-dev.txt "$lock_check_dir/requirements-dev.txt"
          uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -o requirements.txt" -o "$lock_check_dir/requirements.txt" --quiet
          uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes --custom-compile-command "uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes -o requirements-dev.txt" -o "$lock_check_dir/requirements-dev.txt" --quiet
          cmp requirements.txt "$lock_check_dir/requirements.txt"
          cmp requirements-dev.txt "$lock_check_dir/requirements-dev.txt"

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Audit locked dependencies
        run: python -m pip_audit --strict --require-hashes -r requirements-dev.txt

      - name: Validate deployment configuration
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          root = Path.cwd()
          config = tomllib.loads((root / "railway.toml").read_text(encoding="utf-8"))
          nixpacks = tomllib.loads((root / "nixpacks.toml").read_text(encoding="utf-8"))
          command = config["deploy"]["startCommand"]
          assert config["build"]["builder"] == "NIXPACKS"
          assert config["build"]["nixpacksVersion"] == "1.41.0"
          assert nixpacks["phases"]["setup"]["nixpkgsArchive"] == "b4fd65b198c599cbe814fcb9f42d25d021595ec9"
          assert config["deploy"]["healthcheckPath"] == "/ready"
          assert config["deploy"]["healthcheckTimeout"] == 120
          assert config["deploy"]["overlapSeconds"] == 0
          assert "--workers 1" in command
          assert "alembic" not in command.lower()
          assert "migrate_transactional_store" not in command
          assert (root / "Procfile").read_text(encoding="utf-8").strip() == f"web: {command}"
          assert (root / "runtime.txt").read_text(encoding="utf-8").strip() == "python-3.11.16"

      - name: Smoke production lock and Gunicorn/gevent runtime
        if: runner.os == 'Linux'
        run: |
          production_venv="$(mktemp -d)"
          trap 'rm -rf "$production_venv"' EXIT
          python -m venv "$production_venv"
          "$production_venv/bin/python" -m pip install --require-hashes -r requirements.txt
          "$production_venv/bin/python" -m pip check
          "$production_venv/bin/python" -c "from gunicorn.workers.ggevent import GeventWorker"
          PATH="$production_venv/bin:$PATH" "$production_venv/bin/python" tools/smoke_production_runtime.py

      - name: Check templates parse (Jinja)
        run: python tools/check_templates.py

      - name: Verify deterministic PF2e package contracts
        run: python -m pytest -q tests/pf2e_rules --strict-markers

      - name: Run tests
        run: python -m pytest -q -m "not postgresql and not browser" --strict-markers

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      BROWSER_ARTIFACT_DIR: browser-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-browser.txt
          pip-version: "26.2.1"

      - name: Install development-only browser dependencies
        run: |
          python -m pip install --require-hashes -r requirements-browser.txt
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Verify browser lock is current
        run: |
          browser_lock_dir="$(mktemp -d)"
          cp requirements-browser.txt "$browser_lock_dir/requirements-browser.txt"
          uv pip compile requirements-browser.in --universal --python-version 3.11 --generate-hashes --custom-compile-command "uv pip compile requirements-browser.in --universal --python-version 3.11 --generate-hashes -o requirements-browser.txt" -o "$browser_lock_dir/requirements-browser.txt" --quiet
          cmp requirements-browser.txt "$browser_lock_dir/requirements-browser.txt"

      - name: Exercise real character workflows
        # Fixtures migrate a fresh disposable SQLite database for each SQL
        # backend/system case; PostgreSQL row-lock races run in their own job.
        run: python -m pytest -q tests/browser -m browser --strict-markers

      - name: Retain synthetic browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: character-workflow-browser-failures
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://gm_pf2e:gm_pf2e_ci@127.0.0.1:5432/gm_pf2e_test
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gm_pf2e_test
          POSTGRES_PASSWORD: gm_pf2e_ci
          POSTGRES_USER: gm_pf2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gm_pf2e -d gm_pf2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-dev.txt
          pip-version: "26.2.1"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1
          engine.dispose()
          PY

      - name: Apply transactional schema migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run PostgreSQL persistence tests
        run: python -m pytest -q tests/persistence -m postgresql --strict-markers
