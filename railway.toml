# Production deploy (P-1, production-plan.md G1/G2). The image's entrypoint
# (docker/entrypoint.sh) is the only start path: no startCommand here, so
# nothing can bypass its checks or its single gevent worker. Migrations never
# run at start; the pre-deploy step runs them (and the VTT asset-store probe),
# in a separate container without the volume.
#
# Before the first deploy with this file, production needs, deliberately:
#   VTT_ENABLED=0 while the site stays in JSON mode (R-1), and
#   the volume decision in G1: RAILWAY_RUN_UID=0 (option a), or
#   tools/vtt/own_data_volume.sh run once (option b).
# The entrypoint refuses to start on an unwritable /data rather than lose saves.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["sh tools/vtt/predeploy.sh"]
healthcheckPath = "/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
overlapSeconds = 0
drainingSeconds = 30
