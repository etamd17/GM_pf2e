{% if workflow.enabled %}
<section class="character-draft-controls draft-bar" aria-label="Private character draft">
  <p class="draft-bar-title">{% if workflow.recovering %}Saved publication — pending confirmation{% else %}Private draft{% if workflow.targetName %} — updating {{ workflow.targetName }}{% else %} — new character{% endif %}{% endif %}</p>
  <p id="draft-status" role="status" aria-live="polite" tabindex="-1">Loading draft…</p>
  <div class="draft-bar-actions">
    <button type="button" id="draft-save">Save draft</button>
    <button type="button" id="draft-copy" hidden>Save a copy</button>
    <button type="button" id="draft-reload" hidden>Reload saved draft</button>
    <button type="button" id="draft-discard">Discard</button>
    <a href="{{ workflow.cancelUrl }}">Resume drafts</a>
  </div>
</section>
<script src="{{ url_for('static', filename='js/character_drafts.js') }}"></script>
{% endif %}
