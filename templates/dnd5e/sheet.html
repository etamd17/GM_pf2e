{% extends "dnd5e/_base.html" %}
{% block title %}{{ boot.name }} &middot; D&amp;D 5e{% endblock %}
{% block d5_head %}
<style>
  .sh-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: start; }
  .sh-name { font-family: var(--font-display); font-size: 1.7rem; color: var(--d5-2); line-height: 1.1; }
  .sh-hp { display: grid; grid-template-columns: auto auto; gap: .5rem .9rem; align-items: center; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: .6rem .8rem; }
  .sh-hp .big { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; }
  .sh-body { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 1rem; margin-top: 1rem; }
  @media (max-width: 900px) { .sh-body, .sh-top { grid-template-columns: minmax(0, 1fr); } }
  .sh-spell-lvl { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .8rem 0 .3rem; border-bottom: 1px solid var(--d5-line); padding-bottom: .2rem; }
  .sh-spell-lvl .d5-h3 { margin: 0; }
  .sh-feature summary { cursor: pointer; font-weight: 600; padding: .35rem 0; }
  .sh-feature summary .d5-muted { font-weight: 400; margin-left: .4rem; }
  .sh-feature + .sh-feature { border-top: 1px solid rgba(255,255,255,.04); }
  .sh-ds { display: inline-flex; gap: 3px; }
  .sh-ds span { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--text-on-dark-3); display: inline-block; }
  .sh-ds span.s { background: #5fbf7f; border-color: #5fbf7f; }
  .sh-ds span.f { background: #e0603c; border-color: #e0603c; }
  .sh-ident { display: flex; gap: .9rem; align-items: flex-start; min-width: 0; }
  .sh-portrait-btn { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 8px; flex: 0 0 auto; }
  .sh-portrait-btn[disabled] { cursor: default; }
  /* phones: name + line beside a smaller portrait, the stat row full width below */
  @media (max-width: 640px) {
    .sh-ident { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .75rem; align-items: center; }
    .sh-ident > div { display: contents; }
    .sh-ident .sh-portrait-btn { grid-row: 1 / span 2; }
    .sh-ident #sh-name, .sh-ident #sh-line { grid-column: 2; }
    .sh-ident #sh-stats { grid-column: 1 / -1; }
    .sh-ident .d5-portrait { width: 64px; height: 64px; font-size: 1.5rem; }
  }
</style>
{% endblock %}
{% block d5_content %}
<div class="sh-top">
  <div class="sh-ident">
    <button class="sh-portrait-btn" id="sh-portrait" type="button" {% if not can_edit %}disabled{% endif %}
            title="{% if can_edit %}Change portrait{% endif %}"></button>
    <input type="file" id="sh-portrait-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    <div style="min-width:0;">
      <div class="sh-name" id="sh-name"></div>
      <div class="d5-muted" id="sh-line"></div>
      <div class="d5-row" style="margin-top:.6rem;" id="sh-stats"></div>
    </div>
  </div>
  <div class="sh-hp" id="sh-hp"></div>
</div>
<div class="d5-row" style="margin-top:.6rem;" id="sh-conds"></div>
<div class="d5-row" style="margin-top:.45rem;" id="sh-effects"></div>
<div id="sh-notes" class="d5-muted" style="margin-top:.35rem;"></div>
<div class="sh-body">
  <div>
    <div class="d5-card"><div class="d5-abils" style="grid-template-columns:repeat(2,1fr);" id="sh-abils"></div></div>
    <div class="d5-card"><h3>Saving throws</h3><div id="sh-saves"></div></div>
    <div class="d5-card"><h3>Senses</h3><div id="sh-senses"></div></div>
    <div class="d5-card"><h3>Proficiencies</h3><div id="sh-profs" class="d5-prose"></div></div>
  </div>
  <div>
    <div class="d5-cols" style="grid-template-columns:240px minmax(0,1fr);">
      <div class="d5-card"><h3>Skills</h3><div id="sh-skills"></div></div>
      <div>
        <div class="d5-tabs" id="tabs">
          <button class="d5-tab is-on" data-tab="actions">Actions</button>
          <button class="d5-tab" data-tab="spells">Spells</button>
          <button class="d5-tab" data-tab="inventory">Inventory</button>
          <button class="d5-tab" data-tab="features">Features &amp; Traits</button>
          <button class="d5-tab" data-tab="extras">Extras</button>
          <button class="d5-tab" data-tab="background">Background</button>
          <button class="d5-tab" data-tab="notes">Notes</button>
        </div>
        <div class="d5-tabpanel" data-panel="actions" id="p-actions"></div>
        <div class="d5-tabpanel" data-panel="spells" id="p-spells" hidden></div>
        <div class="d5-tabpanel" data-panel="inventory" id="p-inventory" hidden></div>
        <div class="d5-tabpanel" data-panel="features" id="p-features" hidden></div>
        <div class="d5-tabpanel" data-panel="extras" id="p-extras" hidden></div>
        <div class="d5-tabpanel" data-panel="background" id="p-background" hidden></div>
        <div class="d5-tabpanel" data-panel="notes" id="p-notes" hidden></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var PID = {{ pid|tojson }};
  var CAN_EDIT = {{ 'true' if can_edit else 'false' }};
  var CONDITIONS = {{ conditions|tojson }};
  var data = {{ boot|tojson }};
  var tab = 'actions';
  if (CAN_EDIT) D5.rollTarget = PID;

  var S = function () { return data.sheet; };
  var L = function () { return data.live; };

  function api(path, body) {
    return D5.post('/api/dnd5e/pc/' + PID + '/' + path, body).then(function (r) {
      if (r.sheet && r.build) data = r;            // full payload
      else if (r.live) data.live = r.live;          // live-only payload
      (r.events || []).forEach(function (e) {
        if (e.type === 'concentration_check') D5.toast('Concentration check: CON save DC ' + e.dc, 'error');
        if (e.type === 'roll') D5.showRoll(e.what, 'd20', e.natural, e.natural);
      });
      paint();
      return r;
    }).catch(D5.fail);
  }
  function vit(action, extra) { return api('vitals', Object.assign({action: action}, extra || {})); }

  if (CAN_EDIT) {
    var pf = document.getElementById('sh-portrait-file');
    document.getElementById('sh-portrait').addEventListener('click', function () { pf.click(); });
    pf.addEventListener('change', function () {
      if (!pf.files[0]) return;
      var fd = new FormData();
      fd.append('file', pf.files[0]);
      D5.upload('/api/dnd5e/pc/' + PID + '/portrait', fd).then(function (r) {
        data.live.portrait = r.portrait; pf.value = ''; paintHeader(); D5.toast('Portrait updated');
      }).catch(function (e) { pf.value = ''; D5.fail(e); });
    });
  }

  // ---------- header ----------
  function paintHeader() {
    var s = S(), l = L();
    document.getElementById('sh-name').textContent = data.name;
    document.getElementById('sh-portrait').innerHTML = l.portrait
      ? '<img class="d5-portrait" src="' + D5.esc(l.portrait) + '" alt="">'
      : '<span class="d5-portrait is-blank">' + D5.esc(String(data.name || '?').charAt(0).toUpperCase()) + '</span>';
    document.getElementById('sh-line').textContent = [s.race && s.race.name, s.classes.map(function (c) { return c.name + ' ' + c.level + (c.subclass ? ' (' + c.subclass.name + ')' : ''); }).join(' / '),
      s.background && s.background.name, s.edition === 'one' ? '2024 rules' : '2014 rules'].filter(Boolean).join(' · ');
    var stat = function (lbl, val, roll) {
      return '<div class="d5-stat"><div class="lbl">' + lbl + '</div><div class="val">' + (roll ? '<span class="d5-roll" data-roll="' + roll + '" data-label="' + lbl + '">' + val + '</span>' : val) + '</div></div>';
    };
    document.getElementById('sh-stats').innerHTML = stat('Armor Class', s.ac.value) +
      stat('Initiative', D5.mod(s.initiative), '1d20' + D5.mod(s.initiative)) + stat('Speed', s.speed.walk + ' ft') +
      stat('Proficiency', D5.mod(s.proficiency_bonus)) +
      '<div class="d5-stat" title="Heroic Inspiration"><div class="lbl">Inspiration</div><div class="val"><input type="checkbox" id="insp"' + (l.inspiration ? ' checked' : '') + (CAN_EDIT ? '' : ' disabled') + '></div></div>' +
      (CAN_EDIT ? '<div class="d5-row" style="flex-direction:column;"><button class="d5-btn is-sm" data-rest="short">Short rest</button><button class="d5-btn is-sm" data-rest="long">Long rest</button></div>' : '') +
      (CAN_EDIT ? '<a class="d5-btn is-sm is-ghost" href="/dnd5e/character/' + PID + '/build">Edit build / level up</a>' : '');
    var hp = '<div><div class="d5-muted">HIT POINTS</div><div class="big">' + l.hp + ' <span class="d5-muted" style="font-size:1rem;">/ ' + l.hp_max + '</span></div>' +
      (l.temp_hp ? '<div class="d5-temp">+' + l.temp_hp + ' temporary</div>' : '') + D5.hpBar(l.hp, l.hp_max, 0).split('<div class="d5-hptext">')[0] + '</div>';
    if (CAN_EDIT) hp += '<div class="d5-stack"><input class="d5-input is-num" id="hp-amt" type="number" min="0" placeholder="0" style="width:5rem;">' +
      '<div class="d5-row"><button class="d5-btn is-sm" data-hp="heal">Heal</button><button class="d5-btn is-sm is-primary" data-hp="damage">Damage</button></div>' +
      '<button class="d5-btn is-sm is-ghost" data-hp="temp_hp">Temp HP</button></div>';
    if (l.hp <= 0 && !l.dead) {
      var ds = l.death_saves;
      hp += '<div style="grid-column:1/-1;"><b>' + (l.stable ? 'Stable' : 'Death saves') + '</b> <span class="sh-ds">' +
        [0, 1, 2].map(function (i) { return '<span class="' + (i < ds.success ? 's' : '') + '"></span>'; }).join('') + '</span> &nbsp; <span class="sh-ds">' +
        [0, 1, 2].map(function (i) { return '<span class="' + (i < ds.failure ? 'f' : '') + '"></span>'; }).join('') + '</span>' +
        (CAN_EDIT && !l.stable ? ' <button class="d5-btn is-sm" id="ds-roll">Roll death save</button>' : '') + '</div>';
    }
    if (l.dead) hp += '<div style="grid-column:1/-1; color:#ff8b80;"><b>Dead</b></div>';
    document.getElementById('sh-hp').innerHTML = hp;
    var conds = Object.keys(l.conditions || {}).map(function (k) {
      return '<span class="d5-chip is-cond">' + D5.esc(k) + (CAN_EDIT ? '<button data-cond-off="' + D5.esc(k) + '">&times;</button>' : '') + '</span>';
    }).join(' ');
    var exh = l.exhaustion ? '<span class="d5-chip is-cond">Exhaustion ' + l.exhaustion + '</span>' : '';
    var conc = l.concentration ? '<span class="d5-chip is-plain">Concentrating: ' + D5.esc(l.concentration) + (CAN_EDIT ? '<button data-conc-off="1">&times;</button>' : '') + '</span>' : '';
    var add = CAN_EDIT ? '<select class="d5-select" id="cond-add"><option value="">+ condition</option>' + CONDITIONS.filter(function (c) { return c !== 'exhaustion'; }).map(function (c) { return '<option>' + c + '</option>'; }).join('') +
      '</select><label class="d5-check">Exhaustion <input class="d5-input is-num" id="exh" type="number" min="0" max="6" value="' + (l.exhaustion || 0) + '"></label>' : '';
    document.getElementById('sh-conds').innerHTML = conds + exh + conc + add;
    var fx = s.effects || {available: [], active: []};
    var chip = function (e) {
      var on = fx.active.indexOf(e.key) !== -1;
      return '<button class="d5-opt' + (on ? ' is-on' : '') + '" data-fx="' + e.key + '" data-on="' + (on ? 1 : 0) + '" title="' + D5.esc(e.description) + '"' +
        (CAN_EDIT ? '' : ' disabled') + '>' + D5.esc(e.name) + '</button>';
    };
    // Active effects always show; the rest sit behind a toggle (long list on a phone).
    var onList = fx.available.filter(function (e) { return fx.active.indexOf(e.key) !== -1; });
    var offList = fx.available.filter(function (e) { return fx.active.indexOf(e.key) === -1; });
    var wasOpen = document.getElementById('fx-more') && document.getElementById('fx-more').open;
    document.getElementById('sh-effects').innerHTML = fx.available.length ?
      '<span class="d5-muted">Effects:</span> ' + onList.map(chip).join('') +
      (offList.length && CAN_EDIT ? '<details id="fx-more"' + (wasOpen ? ' open' : '') + ' style="display:inline;"><summary class="d5-muted" style="display:inline; cursor:pointer;">' +
        (onList.length ? '+ more' : 'none active — turn one on') + '</summary> ' + offList.map(chip).join('') + '</details>' : '') : '';
    document.getElementById('sh-notes').innerHTML = (s.notes || []).map(function (n) { return '&#8226; ' + D5.esc(n); }).join('<br>');
  }

  // ---------- left column ----------
  function paintLeft() {
    var s = S();
    document.getElementById('sh-abils').innerHTML = D5.abilities.map(function (a) {
      var x = s.abilities[a];
      return '<div class="d5-abil"><div class="lbl">' + D5.abilityNames[a] + '</div><div class="mod"><span class="d5-roll" style="border:0;" data-roll="1d20' + D5.mod(x.mod) + '" data-label="' + D5.abilityNames[a] + ' check">' + D5.mod(x.mod) + '</span></div><div class="score">' + x.score + '</div></div>';
    }).join('');
    document.getElementById('sh-saves').innerHTML = D5.abilities.map(function (a) {
      var x = s.abilities[a];
      return '<div class="d5-skill"><span><span class="d5-pdot' + (x.save_proficient ? ' p1' : '') + '"></span>' + D5.abilityNames[a] + '</span>' +
        '<span class="d5-roll" data-roll="1d20' + D5.mod(x.save) + '" data-label="' + D5.abilityNames[a] + ' save">' + D5.mod(x.save) + '</span></div>';
    }).join('');
    var sen = '<div class="d5-summary-row"><span>Passive Perception</span><b>' + s.passive.perception + '</b></div>' +
      '<div class="d5-summary-row"><span>Passive Investigation</span><b>' + s.passive.investigation + '</b></div>' +
      '<div class="d5-summary-row"><span>Passive Insight</span><b>' + s.passive.insight + '</b></div>';
    Object.keys(s.senses || {}).forEach(function (k) { sen += '<div class="d5-summary-row"><span>' + D5.title(k) + '</span><b>' + s.senses[k] + ' ft.</b></div>'; });
    if (s.resist.length) sen += '<div class="d5-muted" style="margin-top:.4rem;">Resistances: ' + D5.esc(s.resist.join(', ')) + '</div>';
    if (s.immune.length) sen += '<div class="d5-muted">Immunities: ' + D5.esc(s.immune.join(', ')) + '</div>';
    document.getElementById('sh-senses').innerHTML = sen;
    var p = s.proficiencies, line = function (k, v) { return v.length ? '<p><b>' + k + '.</b> ' + D5.esc(v.map(D5.title).join(', ')) + '</p>' : ''; };
    document.getElementById('sh-profs').innerHTML = line('Armor', p.armor) + line('Weapons', p.weapons) + line('Tools', p.tools) + line('Languages', p.languages);
    document.getElementById('sh-skills').innerHTML = Object.keys(s.skills).map(function (k) {
      var x = s.skills[k];
      var cls = x.proficiency === 2 ? 'p2' : (x.proficiency === 1 ? 'p1' : (x.proficiency === 0.5 ? 'p05' : ''));
      return '<div class="d5-skill"><span><span class="d5-pdot ' + cls + '"></span>' + D5.title(k) + ' <span class="d5-muted">' + x.ability.toUpperCase() + '</span></span>' +
        '<span class="d5-roll" data-roll="1d20' + D5.mod(x.mod) + '" data-label="' + D5.title(k) + '">' + D5.mod(x.mod) + '</span></div>';
    }).join('');
  }

  // ---------- tabs ----------
  function pips(kind, key, max, used, extra) {
    var h = '<span class="d5-pips">';
    for (var i = 0; i < Math.min(max, 40); i++) h += '<button class="d5-pip' + (i < used ? ' is-used' : '') + '" data-pip="' + kind + '" data-key="' + D5.esc(key) + '" data-used="' + used + '" data-i="' + i + '"' + (extra || '') + (CAN_EDIT ? '' : ' disabled') + '></button>';
    return h + (max > 40 ? ' <span class="d5-muted">' + (max - used) + ' / ' + max + '</span>' : '') + '</span>';
  }

  function paintActions() {
    var s = S(), l = L();
    var h = '<div class="d5-card"><h3>Attacks</h3><table class="d5-table"><thead><tr><th>Attack</th><th>Range</th><th>Hit</th><th>Damage</th><th>Notes</th></tr></thead><tbody>' +
      s.attacks.map(function (a) {
        return '<tr><td><b>' + D5.esc(a.name) + '</b>' + (a.proficient ? '' : ' <span class="d5-muted">(not proficient)</span>') + '</td><td>' + D5.esc(a.range || '') + '</td>' +
          '<td><span class="d5-roll" data-roll="1d20' + D5.mod(a.to_hit) + '" data-label="' + D5.esc(a.name) + ' attack">' + D5.mod(a.to_hit) + '</span></td>' +
          '<td><span class="d5-roll" data-roll="' + D5.esc(a.damage) + '" data-label="' + D5.esc(a.name) + ' damage">' + D5.esc(a.damage) + '</span> ' + D5.esc(dmgType(a.damage_type)) +
          ((a.extra_damage || []).length ? '<div class="d5-muted">+ ' + a.extra_damage.map(function (x) {
            var dice = x.split(' (')[0].split(' ')[0];
            return '<span class="d5-roll" data-roll="' + D5.esc(dice) + '" data-label="' + D5.esc(x) + '">' + D5.esc(x) + '</span>';
          }).join(', ') + '</div>' : '') +
          (a.versatile ? '<div class="d5-muted">two-handed <span class="d5-roll" data-roll="' + D5.esc(a.versatile) + '" data-label="' + D5.esc(a.name) + ' damage (2H)">' + D5.esc(a.versatile) + '</span></div>' : '') + '</td>' +
          '<td class="d5-muted">' + D5.esc(a.properties.join(', ')) + (a.mastery ? '<div><span class="d5-ref" data-kind="itemMastery" data-id="' + D5.esc(a.mastery.toLowerCase()) + '|xphb">Mastery: ' + D5.esc(a.mastery) + '</span></div>' : '') +
          (a.notes.length ? '<div>' + D5.esc(a.notes.join('; ')) + '</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    if (l.resources.length) {
      h += '<div class="d5-card"><h3>Limited uses</h3>' + l.resources.map(function (r) {
        var custom = r.key.indexOf('custom:') === 0;
        return '<div class="d5-summary-row"><span>' + D5.esc(r.name) + ' <span class="d5-muted">(' + D5.esc(r.recharge) + ')' +
          (r.origin && r.key.indexOf('feature:') === 0 ? ' \u00b7 ' + D5.esc(r.origin) : '') + '</span>' +
          (custom && CAN_EDIT ? ' <button class="d5-btn is-sm is-ghost" data-custom-rm="' + D5.esc(r.key) + '">&times;</button>' : '') +
          '</span>' + pips('resource', r.key, r.max, r.used) + '</div>';
      }).join('') + '</div>';
    }
    if (CAN_EDIT) h += '<div class="d5-card"><h3>Track something else</h3><div class="d5-row">' +
      '<input class="d5-input" id="cr-name" placeholder="Name (e.g. Wand of Web charges)" style="flex:1;">' +
      '<input class="d5-input is-num" id="cr-max" type="number" min="1" max="99" placeholder="Uses">' +
      '<select class="d5-select" id="cr-rest"><option value="long">long rest</option><option value="short">short rest</option></select>' +
      '<button class="d5-btn is-sm" id="cr-add">Add</button></div></div>';
    var hd = l.hit_dice;
    h += '<div class="d5-card"><h3>Hit dice</h3>' + Object.keys(hd).map(function (d) {
      return '<div class="d5-summary-row"><span>' + d + ' <span class="d5-muted">' + (hd[d].max - hd[d].used) + ' of ' + hd[d].max + ' left</span></span>' +
        (CAN_EDIT ? '<button class="d5-btn is-sm" data-hd="' + d + '">Spend (heal)</button>' : '') + '</div>';
    }).join('') + '</div>';
    h += '<div class="d5-card"><h3>Combat actions</h3><div class="d5-prose">' + (s.edition === 'one' ? ['Attack', 'Dash', 'Disengage', 'Dodge', 'Help', 'Hide', 'Influence', 'Magic', 'Ready', 'Search', 'Study', 'Utilize']
      : ['Attack', 'Cast a Spell', 'Dash', 'Disengage', 'Dodge', 'Help', 'Hide', 'Ready', 'Search', 'Use an Object']).map(function (a) {
      return '<span class="d5-ref" data-kind="action" data-id="' + a.toLowerCase() + '|' + (s.edition === 'one' ? 'xphb' : 'phb') + '">' + a + '</span>';
    }).join(' · ') + '</div></div>';
    document.getElementById('p-actions').innerHTML = h;
  }
  function dmgType(t) { return ({B: 'bludgeoning', P: 'piercing', S: 'slashing', A: 'acid', C: 'cold', F: 'fire', O: 'force', L: 'lightning', N: 'necrotic', I: 'poison', Y: 'psychic', R: 'radiant', T: 'thunder'})[t] || t || ''; }

  function paintSpells() {
    var s = S(), l = L();
    var sc = s.spellcasting;
    if (!sc.casters.length && !sc.always.length && !data.spells.length) { document.getElementById('p-spells').innerHTML = '<div class="d5-card d5-muted">No spellcasting.</div>'; return; }
    var h = '<div class="d5-card"><div class="d5-row">' + sc.casters.map(function (c) {
      var prepared = (data.build.choices || {})['spells:' + c.key + ':prepared'] || [];
      return '<div class="d5-stat"><div class="lbl">' + D5.esc(c.name) + ' (' + c.ability.toUpperCase() + ')</div><div class="val">DC ' + c.dc + ' · <span class="d5-roll" data-roll="1d20' + D5.mod(c.attack) + '" data-label="Spell attack">' + D5.mod(c.attack) + '</span></div>' +
        (c.prepared_max != null ? '<div class="d5-muted">prepared ' + prepared.length + ' / ' + c.prepared_max + '</div>' : '') + '</div>';
    }).join('') + '</div>';
    var slotKeys = Object.keys(l.slots);
    if (slotKeys.length) h += '<div style="margin-top:.6rem;">' + slotKeys.map(function (k) {
      return '<div class="d5-summary-row"><span>Level ' + k + ' slots</span>' + pips('slot', k, l.slots[k].max, l.slots[k].used) + '</div>';
    }).join('') + '</div>';
    if (l.pact) h += '<div class="d5-summary-row"><span>Pact slots (level ' + l.pact.level + ')</span>' + pips('pact', 'pact', l.pact.max, l.pact.used) + '</div>';
    h += '</div>';
    var byLevel = {};
    data.spells.forEach(function (sp) { (byLevel[sp.level] = byLevel[sp.level] || []).push(sp); });
    h += '<div class="d5-card">';

    }
    var body = pick === 'pact' ? {kind: 'pact', delta: 1} : {kind: 'slot', level: pick.split(':')[1], delta: 1};
    var slotLevel = pick === 'pact' ? l.pact.level : parseInt(pick.split(':')[1], 10);
    var sp = data.spells.filter(function (x) { return x.id === btn.getAttribute('data-cast'); })[0];
    api('resource', body).then(function () {
      after();
      var n = sp && sp.numbers;
      if (n && n.dice) {
        var expr = diceWithBonus(upcast(n.dice, n.per_slot, slotLevel - lvl), n.bonus);
        D5.doRoll(expr, name + ' (level ' + slotLevel + ')');
      }
    });
  }

  // ---------- live sync (tracker damage, GM edits, other devices) ----------
  D5.sse('dnd5e_pc', function (p) {
    if (p.id !== PID) return;
    if (p.revision < (data.live.revision || 0)) return;
    data.live = p;
    paintHeader();
    if (tab === 'actions') paintActions();
    if (tab === 'spells') paintSpells();
  });
  D5.sse('dnd5e_prompt', function (d) {
    (d.events || []).forEach(function (e) {
      if (e.type === 'turn' && L().name === e.name) D5.toast('<b>Your turn!</b>', 'roll');
      if (d.pc_id === PID && e.type === 'concentration_check') D5.toast('Concentration check: CON save DC ' + e.dc, 'error');
    });
  });
  paint();
})();
</script>
